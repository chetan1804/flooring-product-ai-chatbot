[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flooring-product-ai-chatbot"
version = "0.1.0"
description = "Catalog tooling for an AI-powered flooring recommendation chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
flooring-profile = "flooring_catalog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flooring_catalog"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

