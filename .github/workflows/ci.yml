name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Test
        run: pytest
      - name: Lint and compile
        run: |
          ruff check .
          python -m compileall -q src tests
          node --check src/flooring_catalog/static/widget.js
      - name: Build container
        run: docker build -t flooring-chatbot:ci .
